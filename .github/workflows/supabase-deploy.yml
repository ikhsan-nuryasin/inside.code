name: Deploy Inside Code to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: nxjwctumtkgcyghuzfwm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify critical migrations
        shell: bash
        run: |
          grep -q "to_regprocedure('public.create_class(text, text, integer, text, text)')" \
            supabase/migrations/012_disable_legacy_class_creation.sql
          test -f supabase/migrations/034_security_authorization_followup.sql

      - name: Push database migrations (all pending)
        run: |
          printf 'y\n' | supabase db push \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Function
        run: |
          supabase functions deploy send-notification-push \
            --project-ref "$SUPABASE_PROJECT_ID"
